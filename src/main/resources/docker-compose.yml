version: '2'
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2    
    container_name: elasticsearch
    environment:
      - node.name=elasticsearch
      - cluster.name=elasticsearch-cluster
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.enrollment.enabled=false
    ports:
      - 9200:9200
    networks:
      - elk_network
    deploy:
      resources:
        limits:
          memory: 4G

  logstash:
    image: docker.elastic.co/logstash/logstash:8.19.16
    container_name: logstash
    ports:
      - 5000:5000
      - 9600:9600
    environment:
      LS_JAVA_OPTS: -Xms256m -Xmx256m
    command: >
      logstash -f "E:\\Workspace\\server\\logstash\\logstash-9.3.2\\config\\logstash-elk-kafka.conf"
    networks:
      - elk_network
    depends_on:
      - elasticsearch

  ki8:
    image: docker.elastic.co/kibana/kibana:8.12.2
    container_name: ki8
    ports:
      - 5601:5601
    environment:
      - node.name=ki8
      - cluster.name=elasticsearch-cluster
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - elk_network
    deploy:
      resources:
        limits:
          memory: 2G
    depends_on:
      - elasticsearch

networks:
  elk_network: 
    driver: bridge