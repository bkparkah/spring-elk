version: '1'
services:
  es8:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2    
    container_name: es8
    environment:
      - node.name=es8
      - cluster.name=es8-cluster
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.enrollment.enabled=false
    ports:
      - 9200:9200
    networks:
      - elk_network
    deploy:
      resources:
        limits:
          memory: 4G

  logstash:
    image: docker.elastic.co/logstash/logstash:8.19.16
    container_name: logstash
    ports:
      - 5000:5000
      - 9600:9600
    environment:
      LS_JAVA_OPTS: -Xms256m -Xmx256m
    volumes:
      # Mount local pipeline directory into container
      - ./logstash/pipeline:/e/Workspace/server/logstash/logstash-9.3.2/config
      # Mount local config file
      - ./logstash/config/logstash.conf:/e/Workspace/server/logstash/logstash-9.3.2/config/logstash-elk-kafka.conf"
    command: >
      logstash -f ./logstash/config/logstash.conf
    networks:
      - elk_network
    depends_on:
      - es8

  ki8:
    image: docker.elastic.co/kibana/kibana:8.12.2
    container_name: ki8
    ports:
      - 5601:5601
    environment:
      - node.name=ki8
      - cluster.name=es8-cluster
      - ELASTICSEARCH_HOSTS=http://es8:9200
    networks:
      - elk_network
    deploy:
      resources:
        limits:
          memory: 2G
    depends_on:
      - es8

networks:
  elk_network: 
    driver: bridge