services:
  es8:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2    
    container_name: es8
    environment:
      - node.name=es8
      - cluster.name=es8-cluster
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.enrollment.enabled=false
    ports:
      - 9200:9200
    deploy:
      resources:
        limits:
          memory: 4G

  logstash:
    image: docker.elastic.co/logstash/logstash:8.19.16
    container_name: logstash
    ports:
      - 5000:5000
      - 9600:9600
    environment:
      LS_JAVA_OPTS: -Xms256m -Xmx256m
    volumes:
      - ./logstash/pipeline:/e/Workspace/server/logstash/logstash-9.3.2/config
    depends_on:
      - es8

  ki8:
    image: docker.elastic.co/kibana/kibana:8.12.2
    container_name: ki8
    ports:
      - 5601:5601
    environment:
      - node.name=ki8
      - cluster.name=es8-cluster
      - ELASTICSEARCH_HOSTS=http://localhost:9200
    deploy:
      resources:
        limits:
          memory: 2G
    depends_on:
      - es8
